<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>H. Vianney HADONOU — Designer 3D & Graphiste | Freelance</title>
<script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script>
<script>
(async function(){
  const b64 = await fetch('site.b64z').then(r => r.text());
  const bin = Uint8Array.from(atob(b64.trim()), c => c.charCodeAt(0));
  const html = pako.ungzip(bin, {to:'string'});
  document.open(); document.write(html); document.close();
})();
</script>
</head>
<body><p style="font-family:system-ui;padding:2rem;color:#71717a">Chargement du portfolio…</p></body>
</html>
