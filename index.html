<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>H. Vianney HADONOU — Designer 3D & Graphiste | Freelance</title>
<meta name="description" content="Designer 3D freelance à Cotonou. Conception 3D, animation, VFX, visualisation architecturale."/>
<meta name="theme-color" content="#0D0D1A"/>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#0D0D1A;color:#a1a1aa;display:flex;align-items:center;justify-content:center;min-height:100vh}.loader{text-align:center} .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#FFB951;margin:0 3px;animation:bounce 1.2s infinite ease-in-out}.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}@keyframes bounce{0%,80%,100%{transform:scale(0)}40%{transform:scale(1)}}</style>
</head>
<body>
<div class="loader">
  <p style="margin-bottom:1rem">Chargement du portfolio…</p>
  <div><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
</div>
<script>
(async function(){
  try {
    const parts = await Promise.all([0,1,2].map(i => fetch('part'+i+'.txt').then(r => {
      if (!r.ok) throw new Error('part'+i+' missing');
      return r.text();
    })));
    const html = parts.join('');
    document.open();
    document.write(html);
    document.close();
  } catch (e) {
    document.body.innerHTML = '<p style="padding:2rem;color:#f87171">Erreur de chargement. Vérifiez que part0.txt, part1.txt et part2.txt sont présents.</p><pre style="color:#71717a;padding:1rem">'+e.message+'</pre>';
  }
})();
</script>
</body>
</html>
